# Config do nginx para servir o SPA (build estático do Vite).
# Faz fallback de todas as rotas para index.html (React Router usa history API).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache agressivo para assets com hash no nome.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
